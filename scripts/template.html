<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FSG 필드서비스 KPI 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --bg:#f2f4f7;
    --surface:#ffffff;
    --surface-2:#eaeef3;
    --surface-3:#dde3ea;
    --border:#d8dee6;
    --border-soft:#e6eaf0;
    --text-primary:#0f1720;
    --text-secondary:#5b6674;
    --text-muted:#8b95a3;
    --accent:#2a78d6;
    --accent-soft:#e4eefb;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#5b4fc4;
    --good:#0ca30c; --warning:#c98200; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:#e5f6e2; --warning-soft:#fdf1da; --critical-soft:#fbe6e6;
    --shadow: 0 1px 2px rgba(15,23,32,.04), 0 8px 24px -12px rgba(15,23,32,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#12161b;
      --surface:#1a2027;
      --surface-2:#212832;
      --surface-3:#2a323d;
      --border:#323c47;
      --border-soft:#262e37;
      --text-primary:#eef2f6;
      --text-secondary:#a7b2c0;
      --text-muted:#7c8794;
      --accent:#5b9bee;
      --accent-soft:#1e2f45;
      --s1:#5b9bee; --s2:#e2703a; --s3:#22c087; --s4:#e0a52e; --s5:#e589ab; --s6:#8f85e8;
      --good:#3fc23f; --warning:#e0a52e; --serious:#f0946c; --critical:#e66767;
      --good-soft:#173319; --warning-soft:#33280f; --critical-soft:#3a1c1c;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#12161b;
    --surface:#1a2027;
    --surface-2:#212832;
    --surface-3:#2a323d;
    --border:#323c47;
    --border-soft:#262e37;
    --text-primary:#eef2f6;
    --text-secondary:#a7b2c0;
    --text-muted:#7c8794;
    --accent:#5b9bee;
    --accent-soft:#1e2f45;
    --s1:#5b9bee; --s2:#e2703a; --s3:#22c087; --s4:#e0a52e; --s5:#e589ab; --s6:#8f85e8;
    --good:#3fc23f; --warning:#e0a52e; --serious:#f0946c; --critical:#e66767;
    --good-soft:#173319; --warning-soft:#33280f; --critical-soft:#3a1c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:14px;
    line-height:1.5;
    padding-inline:20px;
    padding-block:20px 56px;
  }
  .mono{font-family:'IBM Plex Mono','Noto Sans KR',monospace; font-variant-numeric: tabular-nums;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* ---------- header ---------- */
  header.top{
    display:flex; flex-wrap:wrap; gap:14px 24px; justify-content:space-between; align-items:flex-end;
    margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid var(--border);
  }
  .brand{display:flex; flex-direction:column; gap:4px;}
  .brand .eyebrow{
    font-size:11px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--accent);
  }
  .brand h1{font-size:22px; margin:0; font-weight:800; letter-spacing:-.01em; text-wrap:balance;}
  .brand .sub{font-size:12.5px; color:var(--text-secondary);}
  .header-meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .theme-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text-secondary);
    border-radius:8px; padding:7px 10px; font-size:12px; cursor:pointer; display:flex; gap:6px; align-items:center;
  }
  .theme-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- tabs ---------- */
  nav.tabs{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  nav.tabs button{
    appearance:none; border:none; background:none; color:var(--text-secondary);
    font:inherit; font-weight:600; font-size:13.5px; padding:10px 16px; cursor:pointer;
    border-bottom:2px solid transparent; margin-bottom:-1px; border-radius:8px 8px 0 0;
    transition:color .15s;
  }
  nav.tabs button:hover{color:var(--text-primary); background:var(--surface-2);}
  nav.tabs button.active{color:var(--accent); border-bottom-color:var(--accent);}

  /* ---------- controls ---------- */
  .controls{display:flex; gap:10px 18px; flex-wrap:wrap; align-items:center; margin-bottom:20px;}
  .control-group{display:flex; align-items:center; gap:8px;}
  .control-label{font-size:11.5px; color:var(--text-muted); font-weight:600; letter-spacing:.03em;}
  .segmented{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px;}
  .segmented button{
    appearance:none; border:none; background:none; color:var(--text-secondary); font:inherit;
    font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .segmented button.active{background:var(--surface); color:var(--text-primary); box-shadow:var(--shadow);}
  select.dd{
    appearance:none; border:1px solid var(--border); background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235b6674"/></svg>') no-repeat right 10px center;
    color:var(--text-primary); font:inherit; font-size:12.5px; font-weight:600; padding:7px 30px 7px 12px;
    border-radius:8px; cursor:pointer; min-width:120px;
  }
  input.search{
    border:1px solid var(--border); background:var(--surface); color:var(--text-primary); font:inherit;
    font-size:12.5px; padding:7px 12px; border-radius:8px; min-width:170px;
  }
  input.search::placeholder{color:var(--text-muted);}

  /* ---------- layout helpers ---------- */
  .grid{display:grid; gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-5{grid-template-columns:repeat(5,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:900px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-5{grid-template-columns:repeat(3,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }
  @media (max-width:520px){ .grid-4{grid-template-columns:1fr;} .grid-5{grid-template-columns:1fr;} }

  section.panel{display:none;}
  section.panel.active{display:block;}
  .block{margin-bottom:22px;}
  .block-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:10px; flex-wrap:wrap;}
  .block-head h2{font-size:15px; margin:0; font-weight:700;}
  .block-head .hint{font-size:11.5px; color:var(--text-muted);}

  .card{
    background:var(--surface); border:1px solid var(--border-soft); border-radius:14px;
    padding:16px 18px; box-shadow:var(--shadow);
  }

  /* ---------- stat tiles ---------- */
  .stat{display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden;}
  .stat .stat-label{font-size:11.5px; color:var(--text-muted); font-weight:600; letter-spacing:.02em; display:flex; justify-content:space-between; align-items:center;}
  .stat .stat-value{font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; letter-spacing:-.01em; display:flex; align-items:baseline; gap:5px;}
  .stat .stat-value .unit{font-size:13px; font-weight:500; color:var(--text-secondary);}
  .stat .stat-delta{font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;}
  .stat .stat-sub{font-size:11.5px; color:var(--text-muted);}
  .delta-up{color:var(--critical);}
  .delta-down{color:var(--good);}
  .delta-flat{color:var(--text-muted);}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 8px;
    border-radius:999px; letter-spacing:.02em;
  }
  .pill.good{background:var(--good-soft); color:var(--good);}
  .pill.warn{background:var(--warning-soft); color:var(--warning);}
  .pill.bad{background:var(--critical-soft); color:var(--critical);}
  .pill.neutral{background:var(--surface-2); color:var(--text-secondary);}
  .pill svg{width:9px;height:9px;}

  /* ---------- charts ---------- */
  .chart-card{padding-bottom:10px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--text-secondary);}
  .legend .item{display:flex; align-items:center; gap:6px;}
  .legend .swatch{width:10px; height:10px; border-radius:3px; flex:none;}
  .legend .line-swatch{width:14px; height:2px; border-radius:2px; flex:none;}
  svg.chart{width:100%; display:block; overflow:visible;}
  svg.chart text{fill:var(--text-secondary); font-family:'IBM Plex Mono','Noto Sans KR',monospace;}
  svg.chart .axis-label{fill:var(--text-muted);}
  svg.chart .grid-line{stroke:var(--border-soft); stroke-width:1;}
  svg.chart .target-line{stroke:var(--text-muted); stroke-width:1.3; stroke-dasharray:3 3;}
  .bar-label{font-size:10.5px; font-weight:600;}
  .value-label{font-size:10.5px; font-weight:600; fill:var(--text-primary) !important;}
  .tooltip{
    position:fixed; pointer-events:none; background:var(--text-primary); color:var(--bg);
    font-size:11.5px; font-family:'IBM Plex Mono','Noto Sans KR',monospace; padding:7px 10px; border-radius:8px;
    box-shadow:var(--shadow); z-index:1000; opacity:0; transition:opacity .1s; max-width:220px; line-height:1.5;
  }
  .tooltip b{display:block; margin-bottom:2px; font-weight:700;}

  /* ---------- tables ---------- */
  table.data-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.data-table th{
    text-align:left; font-size:11px; color:var(--text-muted); font-weight:600; letter-spacing:.03em;
    text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--border); cursor:pointer; white-space:nowrap;
    position:sticky; top:0; background:var(--surface);
  }
  table.data-table th.num, table.data-table td.num{text-align:right; font-family:'IBM Plex Mono',monospace;}
  table.data-table th span.arrow{font-size:9px; margin-left:3px; color:var(--accent);}
  table.data-table td{padding:9px 10px; border-bottom:1px solid var(--border-soft);}
  table.data-table tbody tr:hover{background:var(--surface-2); cursor:pointer;}
  table.data-table tbody tr.self-row{background:var(--accent-soft);}
  .table-scroll{overflow-x:auto; border-radius:12px;}
  .rank-badge{
    display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px;
    background:var(--surface-2); color:var(--text-secondary); font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace;
  }
  .rank-badge.top1{background:var(--warning-soft); color:var(--warning);}
  .rank-badge.top2{background:var(--surface-3); color:var(--text-primary);}
  .rank-badge.top3{background:var(--accent-soft); color:var(--accent);}

  /* ---------- inline score bar (leaderboard table cell) ---------- */
  .score-cell{display:flex; align-items:center; gap:8px; min-width:150px;}
  .score-bar-track{flex:1; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; min-width:60px;}
  .score-bar-fill{height:100%; border-radius:5px;}
  .score-num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; min-width:48px; text-align:right;}

  /* ---------- person picker ---------- */
  .person-shell{display:flex; gap:20px; align-items:flex-start;}
  @media (max-width:800px){ .person-shell{flex-direction:column;} }
  .person-list{
    width:220px; flex:none; background:var(--surface); border:1px solid var(--border-soft); border-radius:14px;
    padding:10px; max-height:520px; overflow-y:auto; box-shadow:var(--shadow);
  }
  @media (max-width:800px){ .person-list{width:100%; max-height:200px;} }
  .person-list .team-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); font-weight:700; padding:8px 8px 4px;}
  .person-item{
    display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border-radius:8px;
    cursor:pointer; font-size:12.5px; font-weight:500;
  }
  .person-item:hover{background:var(--surface-2);}
  .person-item.active{background:var(--accent-soft); color:var(--accent); font-weight:700;}
  .person-item .mini{font-size:10.5px; color:var(--text-muted); font-family:'IBM Plex Mono',monospace;}
  .person-item.active .mini{color:var(--accent);}
  .person-main{flex:1; min-width:0;}

  .person-header{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap;}
  .person-header h2{font-size:20px; margin:0 0 4px; font-weight:800;}
  .team-tag{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; padding:4px 10px;
    border-radius:999px; letter-spacing:.02em;
  }

  .empty-note{color:var(--text-muted); font-size:12px; padding:16px; text-align:center;}
  .caveat{
    display:flex; gap:10px; align-items:flex-start; background:var(--warning-soft); border:1px solid transparent;
    border-radius:12px; padding:12px 14px; font-size:12px; color:var(--text-secondary); margin-bottom:16px;
  }
  .caveat b{color:var(--text-primary);}
  .caveat svg{flex:none; margin-top:1px; color:var(--warning);}

  footer.foot{margin-top:36px; padding-top:16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;}

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  /* ---------- password gate ---------- */
  #lockScreen{
    position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center;
    background:var(--bg); padding:20px;
  }
  #lockScreen .card{width:100%; max-width:340px; text-align:center; padding:32px 28px;}
  #lockScreen .lock-icon{
    width:44px; height:44px; border-radius:12px; background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; margin:0 auto 16px;
  }
  #lockScreen h2{font-size:16px; margin:0 0 6px; font-weight:800;}
  #lockScreen p{font-size:12px; color:var(--text-secondary); margin:0 0 20px;}
  #lockScreen input[type="password"]{
    width:100%; border:1px solid var(--border); background:var(--surface); color:var(--text-primary); font:inherit;
    font-size:14px; padding:10px 12px; border-radius:8px; text-align:center; letter-spacing:.04em;
  }
  #lockScreen button{
    width:100%; margin-top:10px; border:none; background:var(--accent); color:#fff; font:inherit; font-weight:700;
    font-size:13px; padding:10px 12px; border-radius:8px; cursor:pointer;
  }
  #lockScreen button:disabled{opacity:.6; cursor:default;}
  #lockScreen .err{color:var(--critical); font-size:11.5px; margin-top:10px; min-height:14px;}
  #appRoot[hidden]{display:none!important;}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="card">
    <div class="lock-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>FSG KPI 대시보드</h2>
    <p>비밀번호를 입력하세요.</p>
    <form id="lockForm" autocomplete="off">
      <input type="password" id="lockPw" placeholder="비밀번호" autofocus>
      <button type="submit" id="lockBtn">열기</button>
      <div class="err" id="lockErr"></div>
    </form>
  </div>
</div>

<div class="wrap" id="appRoot" hidden>
  <header class="top">
    <div class="brand">
      <span class="eyebrow">FSG Field Service · KPI Monitoring</span>
      <h1>부서원 업무 생산성 KPI 대시보드</h1>
      <span class="sub" id="metaLine">데이터 기준일 · 2026 상반기</span>
    </div>
    <div class="header-meta">
      <button class="theme-btn" id="themeToggle" title="테마 전환">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span id="themeLabel">테마</span>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">전체 개요</button>
    <button data-tab="team">팀별 비교</button>
    <button data-tab="person">개인별 상세</button>
  </nav>

  <div class="controls" id="globalControls">
    <div class="control-group">
      <span class="control-label">기간</span>
      <div class="segmented" id="periodSeg"></div>
    </div>
  </div>

  <section class="panel active" id="panel-overview"></section>
  <section class="panel" id="panel-team"></section>
  <section class="panel" id="panel-person"></section>

  <footer class="foot">
    <span>원본: 부서 KPI 관리 스프레드시트 (Google Sheets → Excel 내보내기) · 40,000건 서비스 기록 기반 집계</span>
    <span>담당자 필드 기준 재집계 · 취소 건 제외</span>
  </footer>
</div>

<div class="tooltip" id="tooltip"></div>

__APP_JS__
</script>
<script>
(function(){
  "use strict";
  var blob = JSON.parse(document.getElementById('enc-blob').textContent);
  function b64ToBytes(b64){
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function showErr(msg){
    document.getElementById('lockErr').textContent = msg;
  }
  function unlockUI(){
    document.getElementById('lockScreen').remove();
    var root = document.getElementById('appRoot');
    root.hidden = false;
  }
  async function tryDecrypt(password){
    var enc = new TextEncoder();
    var salt = b64ToBytes(blob.salt), iv = b64ToBytes(blob.iv), ct = b64ToBytes(blob.data);
    var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:salt, iterations:blob.iter, hash:'SHA-256'},
      baseKey, {name:'AES-GCM', length:256}, false, ['decrypt']
    );
    var plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv:iv}, key, ct);
    var json = new TextDecoder().decode(plainBuf);
    return JSON.parse(json);
  }
  function boot(password, remember){
    return tryDecrypt(password).then(function(DATA){
      unlockUI();
      window.initDashboard(DATA);
      if (remember){
        try{ sessionStorage.setItem('fsg-kpi-pw', password); }catch(e){}
      }
    });
  }
  var form = document.getElementById('lockForm');
  var btn = document.getElementById('lockBtn');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var pw = document.getElementById('lockPw').value;
    if (!pw) return;
    btn.disabled = true; showErr('');
    boot(pw, true).catch(function(){
      btn.disabled = false;
      showErr('비밀번호가 올바르지 않습니다.');
      document.getElementById('lockPw').select();
    });
  });
  // auto-unlock if this browser tab already unlocked it this session
  try{
    var saved = sessionStorage.getItem('fsg-kpi-pw');
    if (saved) boot(saved, false).catch(function(){ try{ sessionStorage.removeItem('fsg-kpi-pw'); }catch(e){} });
  }catch(e){}
})();
</script>
</body>
</html>
